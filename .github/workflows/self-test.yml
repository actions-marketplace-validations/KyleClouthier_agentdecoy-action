name: self-test
on:
  push:
  workflow_dispatch:
jobs:
  passes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: g
        uses: ./
        with:
          site: simgen.dev
      - run: echo "simgen.dev threat level ${{ steps.g.outputs.threat-level }}, ${{ steps.g.outputs.ways-in }} ways in, score ${{ steps.g.outputs.score }}"
  fails-at-elevated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: g
        uses: ./
        continue-on-error: true
        with:
          site: agentdecoy-fixture.web.app
          fail-on: elevated
      - name: The scan must have failed
        run: |
          if [ "${{ steps.g.outcome }}" != "failure" ]; then echo "expected a failure at elevated"; exit 1; fi
          echo "Correctly failed: the fixture is ${{ steps.g.outputs.threat-level }} with ${{ steps.g.outputs.ways-in }} ways in"
          case ",${{ steps.g.outputs.findings }}," in *,hidden_text,*) ;; *) echo "expected hidden_text in findings: ${{ steps.g.outputs.findings }}"; exit 1;; esac
  old-min-grade-still-works:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: g
        uses: ./
        continue-on-error: true
        with:
          site: agentdecoy-fixture.web.app
          min-grade: A
      - run: |
          if [ "${{ steps.g.outcome }}" != "failure" ]; then echo "expected a failure below A"; exit 1; fi
          echo "min-grade still honoured"
  repo-check-catches-a-leak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A committed .env with an OpenAI key must fail
        run: |
          mkdir -p /tmp/leak && cd /tmp/leak && git init -q
          printf 'OPENAI_API_KEY=sk-proj-%s\n' "$(head -c 64 /dev/urandom | base64 | tr -dc A-Za-z0-9 | head -c 40)" > .env
          git add .env
          if GITHUB_WORKSPACE=/tmp/leak FAIL=true bash "${{ github.workspace }}/repo-check.sh"; then echo "expected the repo check to fail"; exit 1; fi
          echo "Correctly caught the committed key"
